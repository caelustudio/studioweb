  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg-primary); color:var(--text-primary);
      font-family:'OPPO Sans 4.0','PingFang SC','Microsoft YaHei',sans-serif;
      font-weight:400; -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }
    a{color:inherit;text-decoration:none}

    /* ===== 顶栏 ===== */
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      gap:16px; padding:16px 28px; border-bottom:1px solid var(--border-color);
      position:sticky; top:0; background:rgba(11,11,11,0.9);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); z-index:50;
    }
    .topbar-left{display:flex;align-items:center;gap:14px;min-width:0}
    .back-home{font-size:.85rem;color:var(--text-muted);white-space:nowrap}
    .back-home:hover{color:var(--text-secondary)}
    .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
    .brand h1{
      margin:0; font-size:1.15rem; font-weight:500; letter-spacing:.02em;
      -webkit-text-stroke:.3px currentColor;
    }
    .brand span{font-size:.78rem;color:var(--text-muted)}
    .topbar-logo{height:34px;width:auto;flex:none}


    .brand-mark{height:26px;width:auto;flex:none;opacity:.9}
    .topbar-right{display:flex;align-items:center;gap:12px;flex:none}
    [data-theme="light"] .topbar{background:rgba(245,245,245,0.9)}
    [data-theme="light"] .field input{background:var(--bg-secondary)}

    /* ===== 容器 ===== */
    .wrap{max-width:960px;margin:0 auto;padding:32px 24px 80px}

    .card{
      background:var(--bg-card); border:1px solid var(--border-card);
      border-radius:16px; box-shadow:var(--shadow-card); padding:24px 22px; margin-bottom:20px;
    }
    .card h2{
      margin:0 0 18px; font-size:1rem; font-weight:500;
      -webkit-text-stroke:.3px currentColor;
    }
    .muted{color:var(--text-muted);font-size:.82rem;line-height:1.7}

    /* ===== 未登录 ===== */
    .auth-tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border-color)}
    .auth-tab{
      flex:0 0 auto; padding:.55rem 4px; margin-right:22px; border:0; background:transparent;
      color:var(--text-secondary); font-size:.92rem; font-family:inherit; cursor:pointer;
      border-bottom:2px solid transparent; transition:color .2s;
    }
    .auth-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .auth-tab:hover{color:var(--text-primary)}
    .field{margin-bottom:14px}
    .field label{display:block;margin-bottom:5px;font-size:.82rem;color:var(--text-secondary)}
    .field input{
      width:100%; padding:.6rem .8rem; border:1px solid var(--border-color); border-radius:10px;
      background:var(--bg-primary); color:var(--text-primary);
      font-family:inherit; font-size:.9rem;
    }
    .field input:focus{outline:none;border-color:var(--accent)}
    .code-row{display:flex;gap:10px}
    .code-row input{flex:1}
    .code-row button{
      white-space:nowrap;padding:0 14px;border:1px solid var(--accent);background:transparent;
      color:var(--accent);border-radius:10px;font-family:inherit;font-size:.85rem;cursor:pointer;
    }
    .code-row button:disabled{opacity:.5;cursor:not-allowed}
    .btn{
      display:block;width:100%;margin-top:8px;text-align:center;background:var(--accent);
      color:#fff;font-size:.95rem;padding:.7rem 1rem;border:0;border-radius:10px;cursor:pointer;
      transition:filter .2s;font-family:inherit;
    }
    .btn:hover{filter:brightness(1.08)}
    .btn[disabled]{opacity:.6;cursor:not-allowed}
    .btn.ghost{background:transparent;border:1px solid var(--border-color);color:var(--text-secondary)}
    .btn.ghost:hover{color:var(--text-primary)}
    .btn.danger{background:transparent;border:1px solid rgba(255,107,107,.35);color:var(--danger)}
    .msg{margin:10px 0 0;font-size:.8rem;min-height:1.2em;text-align:center}
    .msg.err{color:var(--danger)}
    .msg.ok{color:var(--ok)}

    /* ===== Star ID 卡片 ===== */
    .id-card{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    .id-badge{
      flex:none;width:78px;height:78px;border-radius:20px;display:flex;align-items:center;
      justify-content:center;background:linear-gradient(150deg,#0a84ff,#5e5ce6);
      color:#fff;font-size:1.6rem;font-weight:500;
    }
    .id-meta{min-width:0;flex:1}
    .id-label{font-size:.76rem;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase}
    .id-value{font-size:1.5rem;font-weight:500;margin:2px 0 4px;letter-spacing:.04em}
    .id-sub{font-size:.82rem;color:var(--text-secondary)}
    .copy-btn{
      flex:none;padding:.45rem 12px;border:1px solid var(--border-color);background:transparent;
      color:var(--text-secondary);border-radius:8px;font-family:inherit;font-size:.8rem;cursor:pointer;
    }
    .copy-btn:hover{color:var(--text-primary)}

    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
    @media(max-width:640px){.grid2{grid-template-columns:1fr}}

    .divider{height:1px;background:var(--border-color);margin:22px 0}

    /* ===== 记录 ===== */
    .rec-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .rec-tab{
      padding:.4rem 14px;border:1px solid var(--border-color);background:transparent;
      color:var(--text-secondary);border-radius:999px;font-family:inherit;font-size:.82rem;cursor:pointer;
    }
    .rec-tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
    .rec-list{display:flex;flex-direction:column;gap:8px}
    .rec-item{
      display:flex;justify-content:space-between;gap:14px;align-items:flex-start;
      padding:10px 12px;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-primary);
    }
    .rec-main{min-width:0}
    .rec-title{font-size:.88rem;color:var(--text-primary);margin-bottom:3px;word-break:break-all}
    .rec-sub{font-size:.76rem;color:var(--text-muted)}
    .rec-time{flex:none;font-size:.74rem;color:var(--text-muted);white-space:nowrap}

    /* ===== 页脚 ===== */
    footer{padding:28px 24px 40px;text-align:center;color:var(--footer-color);font-size:.78rem}
    footer a{color:var(--footer-color);text-decoration:underline}
    footer a:hover{color:var(--text-secondary)}
  </style>

<body>
  <div class="custom-cursor" id="customCursor"></div>

  <header class="topbar">
    <div class="topbar-left">
      <img class="brand-mark" src="/assets/favicon.png" alt="Caelus Studio" />
      <div class="brand">
        <h1>Star ID</h1>
        <span>Caelus Studio 统一账户</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色/浅色模式">
        <svg id="themeIcon" viewBox="0 0 24 24"></svg>
      </button>
      <img class="topbar-logo" src="/assets/favicon.png" alt="Caelus Studio" />
    </div>
  </header>

  <main class="wrap">
    <!-- ===== 未登录 ===== -->
    <section class="card" id="guestView">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" type="button">登录</button>
        <button class="auth-tab" data-tab="register" type="button">注册</button>
      </div>

      <div id="panelLogin">
        <div class="field"><label>电子邮箱</label><input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" /></div>
        <div class="field"><label>密码</label><input type="password" id="loginPassword" placeholder="密码" autocomplete="current-password" /></div>
        <button class="btn" id="loginBtn" type="button">登录</button>
        <p class="msg err" id="loginErr"></p>
      </div>

      <div id="panelRegister" hidden>
        <div class="field"><label>电子邮箱</label><input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" /></div>
        <div class="field"><label>昵称</label><input type="text" id="regNickname" maxlength="20" placeholder="怎么称呼你" /></div>
        <div class="field">
          <label>邮箱验证码</label>
          <div class="code-row">
            <input type="text" id="regCode" maxlength="6" inputmode="numeric" placeholder="6 位验证码" />
            <button id="regSendCode" type="button">获取验证码</button>
          </div>
        </div>
        <div class="field"><label>密码</label><input type="password" id="regPassword" placeholder="6-64 位密码" autocomplete="new-password" /></div>
        <div class="field"><label>确认密码</label><input type="password" id="regPassword2" placeholder="再次输入密码" autocomplete="new-password" /></div>
        <button class="btn" id="regBtn" type="button">创建 Star ID</button>
        <p class="msg err" id="regErr"></p>
        <p class="msg ok" id="regOk"></p>
      </div>
    </section>

    <!-- ===== 已登录 ===== -->
    <div id="userView" hidden>
      <section class="card">
        <div class="id-card">
          <div class="id-badge" id="idBadge">★</div>
          <div class="id-meta">
            <div class="id-label">Star ID</div>
            <div class="id-value" id="idValue">—</div>
            <div class="id-sub" id="idSub">—</div>
          </div>
          <button class="copy-btn" id="copyId" type="button">复制</button>
        </div>
      </section>

      <section class="card">
        <h2>个人资料</h2>
        <div class="grid2">
          <div class="field"><label>昵称</label><input type="text" id="pfNickname" maxlength="20" /></div>
          <div class="field"><label>QQ</label><input type="text" id="pfQQ" maxlength="20" inputmode="numeric" /></div>
          <div class="field"><label>手机号</label><input type="text" id="pfPhone" maxlength="20" inputmode="tel" /></div>
          <div class="field"><label>收货地址</label><input type="text" id="pfAddress" maxlength="120" placeholder="省 / 市 / 区 + 详细地址" /></div>
        </div>
        <button class="btn" id="saveProfile" type="button">保存资料</button>
        <p class="msg ok" id="profileMsg"></p>
      </section>

      <section class="card">
        <h2>修改密码</h2>
        <div class="field"><label>当前密码</label><input type="password" id="oldPwd" autocomplete="current-password" /></div>
        <div class="field"><label>新密码</label><input type="password" id="newPwd" placeholder="6-64 位" autocomplete="new-password" /></div>
        <div class="field"><label>确认新密码</label><input type="password" id="newPwd2" autocomplete="new-password" /></div>
        <button class="btn" id="changePwd" type="button">修改密码</button>
        <p class="msg" id="pwdMsg"></p>
        <div class="divider"></div>
        <p class="muted">忘记密码？可以用邮箱验证码重置。</p>
        <div class="field" style="margin-top:12px"><label>邮箱验证码</label>
          <div class="code-row">
            <input type="text" id="resetCode" maxlength="6" inputmode="numeric" placeholder="6 位验证码" />
            <button id="sendResetCode" type="button">获取验证码</button>
          </div>
        </div>
        <div class="field"><label>新密码</label><input type="password" id="resetPwd" placeholder="6-64 位" autocomplete="new-password" /></div>
        <button class="btn ghost" id="resetPwdBtn" type="button">用验证码重置密码</button>
        <p class="msg" id="resetMsg"></p>

        <div class="divider"></div>
        <p class="muted">收不到验证码邮件？可以提交人工审核：回答几个只有你本人才清楚的登录信息问题，我们对照你最近的登录活动（时间、地点、系统与浏览器）核实后，会通过邮件回复结果。</p>
        <button class="btn ghost" id="showReqBtn" type="button">申请人工重置密码</button>
        <div id="reqForm" hidden>
          <div class="field"><label>注册邮箱</label><input type="email" id="reqEmail" placeholder="you@example.com" /></div>
          <div class="field"><label>你最近一次登录所在的城市是？</label><input type="text" id="reqCity" placeholder="如：西安" /></div>
          <div class="field"><label>你最常用的操作系统是？</label><input type="text" id="reqOs" placeholder="macOS / Windows / iOS / Android" /></div>
          <div class="field"><label>你最近一次登录使用的浏览器是？</label><input type="text" id="reqBrowser" placeholder="Chrome / Safari / Edge / Firefox" /></div>
          <div class="field"><label>备用联系方式（选填）</label><input type="text" id="reqContact" maxlength="120" placeholder="QQ / 微信，便于我们核实" /></div>
          <div class="field"><label>补充说明（选填）</label><input type="text" id="reqReason" maxlength="200" placeholder="简单说明情况" /></div>
          <button class="btn" id="submitReqBtn" type="button">提交申请</button>
          <p class="msg" id="reqMsg"></p>
        </div>
      </section>

      <section class="card">
        <h2>活动记录</h2>
        <div class="rec-tabs">
          <button class="rec-tab active" data-type="shop" type="button">商店购买</button>
          <button class="rec-tab" data-type="news" type="button">资讯浏览</button>
          <button class="rec-tab" data-type="vba" type="button">VBA 生成</button>
        </div>
        <div class="rec-list" id="recList"><p class="muted">暂无记录</p></div>
      </section>

      <section class="card">
        <h2>账户操作</h2>
        <button class="btn ghost" id="logoutBtn" type="button">退出登录</button>
        <div class="divider"></div>
        <p class="muted">注销后你的 Star ID、资料与记录将被永久删除，且无法恢复。注销会向你的绑定邮箱发送一封确认邮件。</p>
        <button class="btn danger" id="deleteBtn" type="button">注销 Star ID</button>
        <p class="msg" id="deleteMsg"></p>
      </section>
    </div>
  </main>

  <footer>
    <p>© 2026 Caelus Studio · <a href="/privacy/">隐私</a></p>
  </footer>

<script>
/* ===== Star ID 账号中心 ===== */
(function () {
  var API = 'https://caelus-terminal.app.workbuddy.host';
  var COOKIE = 'starid_token';

  function setToken(t) {
    // 跨子域共享登录态（www / shop / news / vba）
    var attrs = '; path=/; max-age=' + (30 * 86400) + '; SameSite=Lax; Secure';
    try {
      document.cookie = COOKIE + '=' + encodeURIComponent(t) + attrs + '; domain=.caelus.top';
    } catch (_) {}
    try { localStorage.setItem(COOKIE, t); } catch (_) {}
  }
  function getToken() {
    var m = document.cookie.match(/(?:^|;\s*)starid_token=([^;]*)/);
    if (m) { try { return decodeURIComponent(m[1]); } catch (_) { return m[1]; } }
    try { return localStorage.getItem(COOKIE) || ''; } catch (_) { return ''; }
  }
  function clearToken() {
    document.cookie = COOKIE + '=; path=/; max-age=0; domain=.caelus.top; SameSite=Lax; Secure';
    try { localStorage.removeItem(COOKIE); } catch (_) {}
  }

  function api(path, data) {
    return fetch(API + path, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(data || {})
    }).then(function (r) { return r.json(); });
  }
  function $(id) { return document.getElementById(id); }
  function show(el, msg, ok) {
    if (!el) return;
    el.textContent = msg || '';
    el.className = 'msg ' + (ok ? 'ok' : 'err');
  }
  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function pwdOk(v) { return typeof v === 'string' && v.length >= 6 && v.length <= 64; }
  function mailOk(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '').trim()); }

  var token = getToken();
  var me = null;
  var records = [];
  var curType = 'shop';

  /* ---- tab 切换 ---- */
  Array.prototype.forEach.call(document.querySelectorAll('.auth-tab'), function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-tab');
      Array.prototype.forEach.call(document.querySelectorAll('.auth-tab'), function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      $('panelLogin').hidden = (t !== 'login');
      $('panelRegister').hidden = (t !== 'register');
    });
  });

  /* ---- 验证码倒计时 ---- */
  var codeTimers = {};
  function countdown(btn, sec, key) {
    btn.disabled = true;
    var left = sec;
    btn.textContent = left + 's';
    codeTimers[key] = setInterval(function () {
      left -= 1;
      if (left <= 0) { clearInterval(codeTimers[key]); btn.disabled = false; btn.textContent = '获取验证码'; }
      else btn.textContent = left + 's';
    }, 1000);
  }

  function sendCode(email, btn, key, errEl) {
    if (!mailOk(email)) { show(errEl, '请输入正确的电子邮箱'); return; }
    btn.disabled = true;
    api('/api/auth/send-code', { email: email }).then(function (r) {
      btn.disabled = false;
      if (r && r.ok) { countdown(btn, 60, key); show(errEl, '验证码已发送，请查收邮件', true); }
      else show(errEl, (r && r.error) || '发送失败，请稍后再试');
    }).catch(function () { btn.disabled = false; show(errEl, '网络错误，请稍后再试'); });
  }

  $('regSendCode').addEventListener('click', function () {
    sendCode($('regEmail').value, this, 'reg', $('regErr'));
  });
  $('sendResetCode').addEventListener('click', function () {
    var email = me && me.email;
    if (!email) { show($('resetMsg'), '请先登录'); return; }
    sendCode(email, this, 'reset', $('resetMsg'));
  });

  /* ---- 注册 ---- */
  $('regBtn').addEventListener('click', function () {
    var email = $('regEmail').value.trim();
    var code = $('regCode').value.trim();
    var pw = $('regPassword').value;
    var pw2 = $('regPassword2').value;
    if (!mailOk(email)) { show($('regErr'), '请输入正确的电子邮箱'); return; }
    if (!/^\d{6}$/.test(code)) { show($('regErr'), '请输入 6 位验证码'); return; }
    if (!pwdOk(pw)) { show($('regErr'), '密码需为 6-64 位'); return; }
    if (pw !== pw2) { show($('regErr'), '两次输入的密码不一致'); return; }
    this.disabled = true;
    var btn = this;
    api('/api/auth/register', { email: email, code: code, password: pw, nickname: $('regNickname').value.trim() })
      .then(function (r) {
        btn.disabled = false;
        if (r && r.ok) { token = r.token; setToken(token); show($('regOk'), 'Star ID 创建成功', true); loadMe(); }
        else show($('regErr'), (r && r.error) || '注册失败');
      }).catch(function () { btn.disabled = false; show($('regErr'), '网络错误，请稍后再试'); });
  });

  /* ---- 登录 ---- */
  $('loginBtn').addEventListener('click', function () {
    var email = $('loginEmail').value.trim();
    var pw = $('loginPassword').value;
    if (!mailOk(email)) { show($('loginErr'), '请输入正确的电子邮箱'); return; }
    if (!pw) { show($('loginErr'), '请输入密码'); return; }
    this.disabled = true;
    var btn = this;
    api('/api/auth/login', { email: email, password: pw }).then(function (r) {
      btn.disabled = false;
      if (r && r.ok) { token = r.token; setToken(token); loadMe(); }
      else show($('loginErr'), (r && r.error) || '登录失败');
    }).catch(function () { btn.disabled = false; show($('loginErr'), '网络错误，请稍后再试'); });
  });

  /* ---- 保存资料 ---- */
  $('saveProfile').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    api('/api/auth/update', {
      token: token,
      nickname: $('pfNickname').value.trim(),
      qq: $('pfQQ').value.trim(),
      phone: $('pfPhone').value.trim(),
      address: $('pfAddress').value.trim()
    }).then(function (r) {
      btn.disabled = false;
      show($('profileMsg'), r && r.ok ? '资料已保存' : ((r && r.error) || '保存失败'), !!(r && r.ok));
      if (r && r.ok) loadMe();
    }).catch(function () { btn.disabled = false; show($('profileMsg'), '网络错误'); });
  });

  /* ---- 修改密码 ---- */
  $('changePwd').addEventListener('click', function () {
    var oldPw = $('oldPwd').value, npw = $('newPwd').value, npw2 = $('newPwd2').value;
    if (!pwdOk(npw)) { show($('pwdMsg'), '新密码需为 6-64 位'); return; }
    if (npw !== npw2) { show($('pwdMsg'), '两次输入的新密码不一致'); return; }
    var btn = this; btn.disabled = true;
    api('/api/auth/password', { token: token, oldPassword: oldPw, newPassword: npw }).then(function (r) {
      btn.disabled = false;
      show($('pwdMsg'), r && r.ok ? '密码已修改，已向你的邮箱发送通知' : ((r && r.error) || '修改失败'), !!(r && r.ok));
      if (r && r.ok) { $('oldPwd').value = ''; $('newPwd').value = ''; $('newPwd2').value = ''; }
    }).catch(function () { btn.disabled = false; show($('pwdMsg'), '网络错误'); });
  });

  /* ---- 验证码重置密码 ---- */
  $('resetPwdBtn').addEventListener('click', function () {
    var email = me && me.email, code = $('resetCode').value.trim(), npw = $('resetPwd').value;
    if (!/^\d{6}$/.test(code)) { show($('resetMsg'), '请输入 6 位验证码'); return; }
    if (!pwdOk(npw)) { show($('resetMsg'), '新密码需为 6-64 位'); return; }
    var btn = this; btn.disabled = true;
    api('/api/auth/password', { email: email, code: code, newPassword: npw }).then(function (r) {
      btn.disabled = false;
      show($('resetMsg'), r && r.ok ? '密码已重置' : ((r && r.error) || '重置失败'), !!(r && r.ok));
    }).catch(function () { btn.disabled = false; show($('resetMsg'), '网络错误'); });
  });

  /* ---- 人工改密申请 ---- */
  var reqWrap = $('reqForm');
  $('showReqBtn').addEventListener('click', function () {
    reqWrap.hidden = !reqWrap.hidden;
    if (!reqWrap.hidden && me && me.email) $('reqEmail').value = me.email;
  });
  $('submitReqBtn').addEventListener('click', function () {
    var email = $('reqEmail').value.trim();
    if (!mailOk(email)) { show($('reqMsg'), '请输入注册邮箱'); return; }
    var answers = {
      city: $('reqCity').value.trim(),
      os: $('reqOs').value.trim(),
      browser: $('reqBrowser').value.trim()
    };
    if (!answers.city || !answers.os || !answers.browser) { show($('reqMsg'), '请回答全部三个问题'); return; }
    var btn = this; btn.disabled = true;
    api('/api/auth/password-request', {
      email: email, answers: answers,
      contact: $('reqContact').value.trim(), reason: $('reqReason').value.trim()
    }).then(function (r) {
      btn.disabled = false;
      if (r && r.ok) {
        show($('reqMsg'), '申请已提交（编号 ' + r.id + '），审核结果会发送到你的邮箱', true);
        reqWrap.hidden = true;
      } else show($('reqMsg'), (r && r.error) || '提交失败');
    }).catch(function () { btn.disabled = false; show($('reqMsg'), '网络错误'); });
  });

  /* ---- 退出 ---- */
  $('logoutBtn').addEventListener('click', function () {
    api('/api/auth/logout', { token: token }).then(function () {});
    clearToken(); token = ''; me = null; render();
  });

  /* ---- 注销 ---- */
  $('deleteBtn').addEventListener('click', function () {
    if (!confirm('确定要注销 Star ID 吗？此操作不可恢复。')) return;
    if (!confirm('再次确认：注销后资料与记录将永久删除。')) return;
    var btn = this; btn.disabled = true;
    api('/api/auth/delete', { token: token }).then(function (r) {
      btn.disabled = false;
      if (r && r.ok) { show($('deleteMsg'), '账号已注销', true); clearToken(); token = ''; me = null; setTimeout(render, 1200); }
      else show($('deleteMsg'), (r && r.error) || '注销失败');
    }).catch(function () { btn.disabled = false; show($('deleteMsg'), '网络错误'); });
  });

  /* ---- 复制 Star ID ---- */
  $('copyId').addEventListener('click', function () {
    var v = $('idValue').textContent.trim();
    if (navigator.clipboard) navigator.clipboard.writeText(v);
    this.textContent = '已复制';
    var b = this;
    setTimeout(function () { b.textContent = '复制'; }, 1500);
  });

  /* ---- 记录 tab ---- */
  Array.prototype.forEach.call(document.querySelectorAll('.rec-tab'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.rec-tab'), function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      curType = b.getAttribute('data-type');
      renderRecords();
    });
  });

  var TYPE_LABEL = { shop: '商店购买', news: '资讯浏览', vba: 'VBA 生成' };

  function recordTitle(r) {
    var m = r.meta || {};
    if (r.type === 'shop') return (m.product || m.name || '商品') + ' ×' + (m.qty || m.quantity || 1) + (m.amount ? '　￥' + m.amount : '');
    if (r.type === 'news') return m.title || m.url || m.path || '浏览了一篇资讯';
    if (r.type === 'vba') return m.title || m.name || m.prompt || '生成了一段 VBA';
    return m.title || JSON.stringify(m).slice(0, 60);
  }
  function recordSub(r) {
    var m = r.meta || {};
    var bits = [];
    if (m.orderId) bits.push('订单号 ' + m.orderId);
    if (m.site) bits.push(m.site);
    if (m.url) bits.push(m.url);
    return bits.join(' · ') || TYPE_LABEL[r.type] || r.type;
  }

  function renderRecords() {
    var list = records.filter(function (r) { return r.type === curType; });
    var box = $('recList');
    if (!list.length) { box.innerHTML = '<p class="muted">暂无' + (TYPE_LABEL[curType] || '') + '记录</p>'; return; }
    box.innerHTML = list.map(function (r) {
      return '<div class="rec-item"><div class="rec-main"><div class="rec-title">' +
        escapeHtml(recordTitle(r)) + '</div><div class="rec-sub">' + escapeHtml(recordSub(r)) +
        '</div></div><div class="rec-time">' + fmtTime(r.ts) + '</div></div>';
    }).join('');
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---- 渲染 ---- */
  function render() {
    var guest = !me;
    $('guestView').hidden = !guest;
    $('userView').hidden = guest;
    if (guest) return;
    $('idValue').textContent = me.starId || '—';
    $('idSub').textContent = me.email + (me.nickname ? '　·　' + me.nickname : '');
    $('idBadge').textContent = '★';
    $('pfNickname').value = me.nickname || '';
    $('pfQQ').value = me.qq || '';
    $('pfPhone').value = me.phone || '';
    $('pfAddress').value = me.address || '';
    renderRecords();
  }

  function loadMe() {
    if (!token) { render(); return; }
    api('/api/auth/me', { token: token }).then(function (r) {
      if (r && r.ok) { me = r.user; render(); loadRecords(); }
      else { clearToken(); token = ''; me = null; render(); }
    }).catch(function () { render(); });
  }
  function loadRecords() {
    api('/api/auth/records', { token: token }).then(function (r) {
      if (r && r.ok) { records = r.records || []; me = r.user || me; renderRecords(); }
    }).catch(function () {});
  }

  render();
  loadMe();
})();
</script>

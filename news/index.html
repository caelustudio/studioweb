<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新闻中心 - Caelus Studio</title>
  <meta name="description" content="Caelus Studio 新闻中心：工作室的最新动态、产品发布与活动信息。" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Caelus Studio" />
  <meta property="og:title" content="新闻中心 - Caelus Studio" />
  <meta property="og:description" content="Caelus Studio 的最新动态、产品发布与活动信息。" />
  <meta property="og:locale" content="zh_CN" />
  <script>
    (function(){var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0b0b0b;
      --bg-secondary: #0b0b0b;
      --bg-card: #111;
      --text-primary: #f0f0f0;
      --text-secondary: #d0d0d0;
      --text-muted: #888;
      --border-color: rgba(255,255,255,0.06);
      --shadow-card: 0 4px 16px rgba(0,0,0,0.3);
      --accent: #0a84ff;
      --accent-soft: rgba(10,132,255,0.12);
      --footer-color: #555;
      --footer-highlight: #666;
    }

    [data-theme="light"] {
      --bg-primary: #f5f5f5;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #2a2a2a;
      --text-muted: #555;
      --border-color: rgba(0,0,0,0.08);
      --shadow-card: 0 4px 16px rgba(0,0,0,0.06);
      --accent: #0a84ff;
      --accent-soft: rgba(10,132,255,0.10);
      --footer-color: #999;
      --footer-highlight: #aaa;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: system-ui, -apple-system, "PingFang SC", "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    /* ===== 自定义圆形光标 ===== */
    body { cursor: none; }
    a, button { cursor: none !important; }
    .custom-cursor {
      position: fixed; top: 0; left: 0;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.3);
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, background 0.2s, border-color 0.2s;
      will-change: transform;
    }
    [data-theme="light"] .custom-cursor {
      background: rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.15);
    }
    .custom-cursor.clicked {
      width: 8px; height: 8px;
      background: rgba(255,255,255,0.3);
      border-color: rgba(255,255,255,0.6);
    }
    [data-theme="light"] .custom-cursor.clicked {
      background: rgba(0,0,0,0.15);
      border-color: rgba(0,0,0,0.3);
    }
    .custom-cursor.hover {
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
    }
    [data-theme="light"] .custom-cursor.hover {
      background: rgba(0,0,0,0.04);
      border-color: rgba(0,0,0,0.08);
    }
    @media (pointer: coarse) {
      .custom-cursor { display: none !important; }
      body { cursor: auto; }
      a, button { cursor: auto !important; }
    }

    /* ===== 导航栏 ===== */
    .site-nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: transparent;
      transition: background 0.3s ease, border-color 0.3s ease;
      border-bottom: 1px solid transparent;
    }
    .site-nav.scrolled {
      background: color-mix(in srgb, var(--bg-primary) 82%, transparent);
      border-bottom-color: var(--border-color);
    }
    .nav-brand { font-size: 1rem; font-weight: 600; letter-spacing: 0.01em; }
    .nav-right { display: flex; align-items: center; gap: 1.6rem; }
    .nav-links { display: flex; gap: 1.6rem; }
    .nav-links a { font-size: 0.88rem; color: var(--text-secondary); transition: color 0.3s ease; }
    .nav-links a:hover { color: var(--text-primary); }
    .theme-toggle {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--accent-soft);
      color: var(--text-primary);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.3s ease;
    }
    .theme-toggle:hover { transform: scale(1.06); }
    .theme-toggle svg { width: 19px; height: 19px; fill: currentColor; }

    /* ===== 首屏 ===== */
    .hero {
      padding: 9.5rem 2rem 4rem;
      max-width: 1060px;
      margin: 0 auto;
      background:
        radial-gradient(ellipse 70% 55% at 50% 0%, rgba(10,132,255,0.14), transparent 65%);
    }
    .kicker {
      display: inline-block;
      font-size: 0.85rem;
      color: var(--accent);
      letter-spacing: 0.12em;
      margin-bottom: 0.7rem;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .hero .sub {
      margin-top: 1rem;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      font-weight: 300;
      color: var(--text-secondary);
    }

    /* ===== 新闻列表 ===== */
    .news-list {
      max-width: 1060px;
      margin: 0 auto;
      padding: 1rem 2rem 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.6rem;
    }
    .news-card {
      display: flex; flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .news-card:hover { transform: translateY(-4px); border-color: var(--accent-soft); }
    .news-card.first { grid-column: 1 / -1; }
    .news-card .thumb {
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: linear-gradient(180deg, #96C5F0 0%, #ECF5FD 100%);
    }
    .news-card.first .thumb { aspect-ratio: 21 / 9; }
    .news-card .thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .news-card:hover .thumb img { transform: scale(1.03); }
    .news-card .body { padding: 1.4rem 1.6rem 1.6rem; display: flex; flex-direction: column; gap: 0.55rem; flex: 1; }
    .news-meta {
      display: flex; align-items: center; gap: 0.8rem;
      font-size: 0.78rem; color: var(--text-muted);
    }
    .news-tag {
      font-size: 0.72rem;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent-soft);
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      letter-spacing: 0.05em;
    }
    .news-card h2 { font-size: 1.25rem; font-weight: 600; line-height: 1.35; }
    .news-card.first h2 { font-size: 1.7rem; }
    .news-card p { font-size: 0.92rem; font-weight: 300; color: var(--text-secondary); line-height: 1.7; }
    .news-more { margin-top: auto; padding-top: 0.4rem; font-size: 0.88rem; color: var(--accent); }

    /* ===== 页脚 ===== */
    .site-footer {
      max-width: 1060px;
      margin: 4.5rem auto 0;
      padding: 2rem 2rem 3.5rem;
      border-top: 1px solid var(--border-color);
      display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
      color: var(--footer-color);
      font-size: 0.82rem;
    }
    .site-footer .highlight { color: var(--footer-highlight); }

    /* ===== 滚动入场动画 ===== */
    .reveal { opacity: 0; }
    .reveal.reveal-visible {
      animation: heroFadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: var(--reveal-delay, 0s);
    }
    @keyframes heroFadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; }
    }

    /* ===== 响应式 ===== */
    @media (max-width: 760px) {
      .site-nav { padding: 0 1.3rem; }
      .nav-links { display: none; }
      .hero { padding: 7.5rem 1.3rem 3rem; }
      .news-list { grid-template-columns: 1fr; padding: 1rem 1.3rem 0; }
      .news-card.first h2 { font-size: 1.4rem; }
      .site-footer { padding: 2rem 1.3rem 3rem; }
    }
  </style>
</head>
<body>

<div class="custom-cursor" id="customCursor"></div>

<!-- ===== 导航栏 ===== -->
<nav class="site-nav" id="siteNav">
  <a class="nav-brand" href="../index.html">Caelus Studio</a>
  <div class="nav-right">
    <ul class="nav-links">
      <li><a href="../index.html">主站首页</a></li>
      <li><a href="../nav/">导航</a></li>
    </ul>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色模式">
      <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
    </button>
  </div>
</nav>

<!-- ===== 首屏 ===== -->
<section class="hero reveal">
  <span class="kicker">新闻中心</span>
  <h1>来自 Caelus Studio 的最新动态。</h1>
  <div class="sub">产品发布、活动信息与工作室的每一步，都在这里。</div>
</section>

<!-- ===== 新闻列表 =====
  新增一篇新闻时：
  1. 复制本目录下的 _template.html，改名为 日期-英文短名.html
  2. 在这里复制一份 <a class="news-card ..."> 放到最前面（最新的排在最上面）
  3. 更新 sitemap.xml
-->
<section class="news-list" id="newsList">

  <a class="news-card first reveal" href="2026-09-13-keychain.html">
    <div class="thumb"><img src="assets/keychain.png" alt="Caelus Studio 钥匙扣" loading="lazy"></div>
    <div class="body">
      <div class="news-meta"><span class="news-tag">产品发布</span><span>2026 年 9 月 13 日</span></div>
      <h2>Caelus Studio 首款官方周边「钥匙扣」开启免费领取</h2>
      <p>精致透明亚克力材质，C 形 logo 精细切割。QQ 群成员今晚 18:00 前可 0 元领取，之后恢复 ¥9.9/个。</p>
      <span class="news-more">阅读全文 →</span>
    </div>
  </a>

</section>

<!-- ===== 页脚 ===== -->
<div class="site-footer reveal">
  <span>©️ 2026 Caelus Studio</span>
  <span class="highlight">网页由人工智能辅助生成</span>
</div>

<script>
/* ===== 主题切换 ===== */
(function() {
  var btn = document.getElementById('themeToggle');
  var icon = document.getElementById('themeIcon');
  var html = document.documentElement;
  function render(theme) {
    if (theme === 'light') {
      icon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
    } else {
      icon.innerHTML = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
    }
  }
  btn.addEventListener('click', function() {
    var next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    render(next);
  });
  render(html.getAttribute('data-theme'));
})();

/* ===== 导航栏滚动状态 ===== */
(function() {
  var nav = document.getElementById('siteNav');
  function onScroll() { nav.classList.toggle('scrolled', window.scrollY > 40); }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();

/* ===== 自定义圆形光标 ===== */
(function() {
  var cursor = document.getElementById('customCursor');
  document.addEventListener('mousemove', function(e) {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });
  document.addEventListener('mousedown', function() { cursor.classList.add('clicked'); });
  document.addEventListener('mouseup', function() { cursor.classList.remove('clicked'); });
  document.addEventListener('mouseleave', function() { cursor.style.display = 'none'; });
  document.addEventListener('mouseenter', function() { cursor.style.display = 'block'; });
  document.querySelectorAll('a, button').forEach(function(el) {
    el.addEventListener('mouseenter', function() { cursor.classList.add('hover'); });
    el.addEventListener('mouseleave', function() { cursor.classList.remove('hover'); });
  });
})();

/* ===== 滚动入场动画 ===== */
(function() {
  var revealEls = document.querySelectorAll('.reveal');
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('reveal-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
  revealEls.forEach(function(el) { observer.observe(el); });
})();
</script>
</body>
</html>

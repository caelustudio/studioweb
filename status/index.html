<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>站点状态 · Caelus Studio</title>
  <meta name="description" content="Caelus Studio 全站点可用性状态实时页面">
  <link rel="icon" type="image/png" href="../favicon.png">
  <style>
    :root, [data-theme="dark"] {
      --bg: #0b0b0b;
      --panel: #141414;
      --border: rgba(255,255,255,0.08);
      --text: #f5f5f5;
      --text-2: rgba(245,245,245,0.6);
      --text-3: rgba(245,245,245,0.4);
      --ok: #34c77b;
      --fail: #ff5a5a;
      --accent: rgba(255,255,255,0.06);
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --border: rgba(0,0,0,0.08);
      --text: #1a1a1a;
      --text-2: rgba(26,26,26,0.6);
      --text-3: rgba(26,26,26,0.4);
      --ok: #1fa864;
      --fail: #e03e3e;
      --accent: rgba(0,0,0,0.05);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "OPPO Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.25rem 4rem;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .wrap { width: 100%; max-width: 680px; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.2rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 500;
    }
    .brand img { width: 30px; height: 30px; border-radius: 50%; }
    .theme-toggle {
      background: var(--accent);
      border: 1px solid var(--border);
      color: var(--text-2);
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.2s;
    }
    .theme-toggle:hover { color: var(--text); }
    h1 { font-size: 1.9rem; font-weight: 500; letter-spacing: -0.01em; }
    .summary {
      color: var(--text-2);
      margin-top: 0.5rem;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 1.4em;
    }
    .summary .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--text-3);
      flex-shrink: 0;
    }
    .summary .dot.ok { background: var(--ok); }
    .summary .dot.fail { background: var(--fail); }
    .row {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.7rem;
      transition: border-color 0.3s ease, background 0.3s ease;
    }
    .row .dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: var(--text-3);
      flex-shrink: 0;
      position: relative;
    }
    .row .dot.ok { background: var(--ok); }
    .row .dot.fail { background: var(--fail); }
    .row .dot.ok::after, .summary .dot.ok::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1.5px solid var(--ok);
      opacity: 0.35;
    }
    .row .info { flex: 1; min-width: 0; }
    .row .name { font-weight: 450; font-size: 1.02rem; }
    .row .url {
      font-size: 0.82rem;
      color: var(--text-3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 0.15rem;
    }
    .row a.url { text-decoration: none; display: block; }
    .row a.url:hover .url { color: var(--text-2); }
    .row .meta { text-align: right; flex-shrink: 0; }
    .row .ms { font-size: 0.88rem; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .row .when { font-size: 0.75rem; color: var(--text-3); margin-top: 0.15rem; }
    .row .detail { font-size: 0.82rem; color: var(--fail); margin-top: 0.15rem; }
    .foot {
      margin-top: 2.4rem;
      color: var(--text-3);
      font-size: 0.8rem;
      text-align: center;
      line-height: 1.7;
    }
    .foot a { color: var(--text-3); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="/">
        <img src="../favicon.png" alt="Caelus Studio">
        Caelus Studio
      </a>
      <button class="theme-toggle" id="themeToggle" type="button">浅色</button>
    </div>

    <h1>站点状态</h1>
    <div class="summary"><span class="dot" id="sumDot"></span><span id="sumText">正在检测各站点……</span></div>

    <div id="rows"></div>

    <div class="foot">
      每 60 秒自动刷新 · 由 Caelus 可用性监控提供<br>
      © 2026 Caelus Studio · <a href="/">返回主站</a>
    </div>
  </div>

  <script>
    var API = 'https://caelus-status.app.workbuddy.host/api/status';

    // 主题：记忆 > 跟随系统
    var saved = null;
    try { saved = localStorage.getItem('caelus_status_theme'); } catch (e) {}
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    setTheme(saved || (prefersLight ? 'light' : 'dark'));

    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeToggle').textContent = t === 'dark' ? '浅色' : '深色';
    }

    document.getElementById('themeToggle').addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
      try { localStorage.setItem('caelus_status_theme', next); } catch (e) {}
    });

    function fmtTime(iso) {
      try {
        var d = new Date(iso);
        return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      } catch (e) { return ''; }
    }

    function render(d) {
      var rows = document.getElementById('rows');
      var h = '';
      d.results.forEach(function (r) {
        h += '<div class="row">'
          + '<span class="dot ' + (r.ok ? 'ok' : 'fail') + '"></span>'
          + '<div class="info"><div class="name">' + r.name + '</div>'
          + '<a class="url" href="' + r.url + '" target="_blank" rel="noopener"><div class="url">' + r.url + '</div></a>'
          + '</div>'
          + '<div class="meta">'
          + (r.ok
              ? '<div class="ms">' + (r.ms >= 1000 ? (r.ms / 1000).toFixed(2) + 's' : r.ms + 'ms') + '</div>'
              : '<div class="detail">' + (r.detail || '故障') + '</div>')
          + '<div class="when">' + fmtTime(r.at) + ' 检测</div>'
          + '</div>'
          + '</div>';
      });
      rows.innerHTML = h;

      var dot = document.getElementById('sumDot');
      var txt = document.getElementById('sumText');
      if (d.allOk) {
        dot.className = 'dot ok';
        txt.textContent = '所有系统运行正常 · 共 ' + d.results.length + ' 项检测';
      } else {
        var bad = d.results.filter(function (r) { return !r.ok; }).length;
        dot.className = 'dot fail';
        txt.textContent = '发现 ' + bad + ' 项故障，我们正在关注';
      }
    }

    function load() {
      fetch(API, { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(render)
        .catch(function () {
          document.getElementById('sumDot').className = 'dot fail';
          document.getElementById('sumText').textContent = '状态服务暂时无法访问';
        });
    }

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>

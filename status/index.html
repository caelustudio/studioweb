<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>站点状态 · Caelus Studio</title>
  <meta name="description" content="Caelus Studio 全站点可用性状态实时页面">
  <link rel="icon" type="image/png" href="../favicon.png">
  <style>
    :root, [data-theme="dark"] {
      --bg: #0b0b0b;
      --panel: #141414;
      --border: rgba(255,255,255,0.08);
      --text: #f5f5f5;
      --text-2: rgba(245,245,245,0.6);
      --text-3: rgba(245,245,245,0.4);
      --ok: #34c77b;
      --fail: #ff5a5a;
      --accent: rgba(255,255,255,0.06);
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --border: rgba(0,0,0,0.08);
      --text: #1a1a1a;
      --text-2: rgba(26,26,26,0.6);
      --text-3: rgba(26,26,26,0.4);
      --ok: #1fa864;
      --fail: #e03e3e;
      --accent: rgba(0,0,0,0.05);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { cursor: none; }
    html a, html button { cursor: none; }
    body {
      font-family: "OPPO Sans", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.25rem 4rem;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .wrap { width: 100%; max-width: 680px; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.2rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .brand img { width: 30px; height: 30px; border-radius: 50%; }
    .theme-toggle {
      flex-shrink: 0;
      background: var(--accent);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: none;
      transition: all 0.3s ease;
      color: var(--text);
      user-select: none;
    }
    .theme-toggle:hover {
      transform: scale(1.08);
      filter: brightness(1.6);
    }
    [data-theme="light"] .theme-toggle:hover { filter: brightness(0.92); }
    .theme-toggle svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .theme-toggle:hover svg { transform: rotate(30deg); }
    h1 { font-size: 1.9rem; font-weight: 500; letter-spacing: -0.01em; }
    .summary {
      color: var(--text-2);
      margin-top: 0.5rem;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 1.4em;
      transition: color 0.3s ease;
    }
    .summary .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--text-3);
      flex-shrink: 0;
      position: relative;
    }
    .summary .dot.ok { background: var(--ok); }
    .summary .dot.fail { background: var(--fail); }
    .summary .dot.ok::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1.5px solid var(--ok);
      opacity: 0.35;
    }
    .row {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.7rem;
      transition: border-color 0.3s ease, background 0.3s ease, transform 0.25s ease, opacity 0.5s ease;
      opacity: 0;
      transform: translateY(8px);
      user-select: none;
    }
    .row .main { display: flex; align-items: center; gap: 0.9rem; }
    .row.open { border-color: rgba(52,199,123,0.35); }
    .row.shown { opacity: 1; transform: translateY(0); }
    .row:hover { transform: translateY(-2px); }
    .row .chev {
      flex-shrink: 0;
      width: 18px; height: 18px;
      fill: none;
      stroke: var(--text-3);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.3s ease;
    }
    .row.open .chev { transform: rotate(180deg); stroke: var(--text-2); }
    .row .more {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.35s ease;
    }
    .row.open .more { max-height: 180px; opacity: 1; margin-top: 0.85rem; }
    .row .kv { display: flex; gap: 0.5rem; font-size: 0.85rem; color: var(--text-2); }
    .row .kv b { color: var(--text-3); font-weight: 400; flex-shrink: 0; }
    .row .kv span { word-break: break-all; }
    .row .visit {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--accent);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.45rem 1rem;
      font-size: 0.85rem;
      color: var(--text);
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
      cursor: none;
    }
    .row .visit:hover { transform: translateY(-1px); filter: brightness(1.4); }
    [data-theme="light"] .row .visit:hover { filter: brightness(0.94); }
    .row .visit svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .row .dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: var(--text-3);
      flex-shrink: 0;
      position: relative;
    }
    .row .dot.ok { background: var(--ok); }
    .row .dot.fail { background: var(--fail); }
    .row .dot.ok::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1.5px solid var(--ok);
      opacity: 0.35;
    }
    .row .info { flex: 1; min-width: 0; }
    .row .name { font-weight: 450; font-size: 1.02rem; transition: color 0.3s ease; }
    .row .url {
      font-size: 0.82rem;
      color: var(--text-3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 0.15rem;
      transition: color 0.3s ease;
    }
    .row a.url { text-decoration: none; display: block; }
    .row a.url:hover .url { color: var(--text-2); }
    .row .meta { text-align: right; flex-shrink: 0; }
    .row .ms { font-size: 0.88rem; color: var(--text-2); font-variant-numeric: tabular-nums; transition: color 0.3s ease; }
    .row .when { font-size: 0.75rem; color: var(--text-3); margin-top: 0.15rem; transition: color 0.3s ease; }
    .row .detail { font-size: 0.82rem; color: var(--fail); margin-top: 0.15rem; }
    .foot {
      margin-top: 2.4rem;
      color: var(--text-3);
      font-size: 0.8rem;
      text-align: center;
      line-height: 1.7;
      transition: color 0.3s ease;
    }
    .foot a { color: var(--text-3); }

    /* ===== 自定义圆形光标（与主站一致） ===== */
    .custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, background 0.2s, border-color 0.2s;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
      will-change: transform;
    }
    [data-theme="light"] .custom-cursor {
      background: rgba(0, 0, 0, 0.06);
      border-color: rgba(0, 0, 0, 0.15);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.03);
    }
    .custom-cursor.clicked {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.6);
    }
    [data-theme="light"] .custom-cursor.clicked {
      background: rgba(0, 0, 0, 0.15);
      border-color: rgba(0, 0, 0, 0.3);
    }
    .custom-cursor.hover {
      width: 28px;
      height: 28px;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }
    [data-theme="light"] .custom-cursor.hover {
      background: rgba(0, 0, 0, 0.04);
      border-color: rgba(0, 0, 0, 0.08);
    }
    @media (pointer: coarse) {
      .custom-cursor { display: none !important; }
      html, html a, html button { cursor: auto !important; }
    }
  </style>
</head>
<body>
  <div class="custom-cursor" id="customCursor"></div>

  <div class="wrap">
    <div class="top">
      <a class="brand" href="/">
        <img src="../favicon.png" alt="Caelus Studio">
        Caelus Studio
      </a>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深浅色">
        <svg viewBox="0 0 24 24" id="themeIcon"></svg>
      </button>
    </div>

    <h1>站点状态</h1>
    <div class="summary"><span class="dot" id="sumDot"></span><span id="sumText">正在检测各站点……</span></div>

    <div id="rows"></div>

    <div class="foot">
      每 60 秒自动刷新 · 由 Caelus 可用性监控提供<br>
      © 2026 Caelus Studio · <a href="/">返回主站</a>
    </div>
  </div>

  <script>
    var API = 'https://caelus-status.app.workbuddy.host/api/status';

    // ===== 自定义光标 =====
    var cursor = document.getElementById('customCursor');
    document.addEventListener('mousemove', function (e) {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
      cursor.style.opacity = '1';
    });
    document.addEventListener('mousedown', function () { cursor.classList.add('clicked'); });
    document.addEventListener('mouseup', function () { cursor.classList.remove('clicked'); });
    document.addEventListener('mouseleave', function () { cursor.style.display = 'none'; });
    document.addEventListener('mouseenter', function () { cursor.style.display = 'block'; cursor.style.opacity = '1'; });
    function bindCursorHover() {
      document.querySelectorAll('a, button').forEach(function (el) {
        if (el.dataset.cursorBound) return;
        el.dataset.cursorBound = '1';
        el.addEventListener('mouseenter', function () { cursor.classList.add('hover'); });
        el.addEventListener('mouseleave', function () { cursor.classList.remove('hover'); });
      });
    }
    bindCursorHover();

    // ===== 主题切换（与主站共用 localStorage 'theme' 键） =====
    var html = document.documentElement;
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
    var SUN = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
    var MOON = '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/><path d="M12 4a8 8 0 0 0-4 15 8 8 0 0 0 4-15z" opacity="0.6"/>';

    var savedTheme = null;
    try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
    var currentTheme = savedTheme || (prefersDark.matches ? 'dark' : 'light');

    function setTheme(theme) {
      currentTheme = theme;
      html.setAttribute('data-theme', theme);
      try { localStorage.setItem('theme', theme); } catch (e) {}
      document.getElementById('themeIcon').innerHTML = theme === 'dark' ? SUN : MOON;
    }

    document.getElementById('themeToggle').addEventListener('click', function () {
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    if (prefersDark.addEventListener) prefersDark.addEventListener('change', function (e) {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (err) {}
      if (!stored) setTheme(e.matches ? 'dark' : 'light');
    });

    setTheme(currentTheme);

    // ===== 状态渲染 =====
    function fmtTime(iso) {
      try {
        var d = new Date(iso);
        return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      } catch (e) { return ''; }
    }

    function render(d) {
      var rows = document.getElementById('rows');
      var h = '';
      d.results.forEach(function (r, idx) {
        h += '<div class="row" data-idx="' + idx + '" role="button" tabindex="0">'
          + '<div class="main">'
          + '<span class="dot ' + (r.ok ? 'ok' : 'fail') + '"></span>'
          + '<div class="info"><div class="name">' + r.name + '</div>'
          + '<div class="url">' + r.url.replace(/^https?:\/\//, '').replace(/\/$/, '') + '</div>'
          + '</div>'
          + '<div class="meta">'
          + (r.ok
              ? '<div class="ms">' + (r.ms >= 1000 ? (r.ms / 1000).toFixed(2) + 's' : r.ms + 'ms') + '</div>'
              : '<div class="detail">' + (r.detail || '故障') + '</div>')
          + '<div class="when">' + fmtTime(r.at) + ' 检测</div>'
          + '</div>'
          + '<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>'
          + '</div>'
          + '<div class="more">'
          + '<div class="kv"><b>域名</b><span>' + r.url.replace(/\/$/, '') + '</span></div>'
          + '<div class="kv"><b>状态</b><span>' + (r.ok ? '✅ 正常运行' : '❌ 故障') + ' · HTTP ' + (r.code || '-') + '</span></div>'
          + '<div class="kv"><b>响应</b><span>' + (r.ms >= 1000 ? (r.ms / 1000).toFixed(2) + ' 秒' : r.ms + ' 毫秒') + '</span></div>'
          + '<div class="kv"><b>检测</b><span>' + new Date(r.at).toLocaleString('zh-CN') + '</span></div>'
          + '<a class="visit" href="' + r.url + '" target="_blank" rel="noopener">前往站点 <svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></a>'
          + '</div>'
          + '</div>';
      });
      rows.innerHTML = h;

      // 点击展开/收起详情
      rows.querySelectorAll('.row').forEach(function (el) {
        var r = d.results[+el.dataset.idx];
        el.addEventListener('click', function (e) {
          if (e.target.closest('.visit')) return;
          el.classList.toggle('open');
        });
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.classList.toggle('open'); }
        });
      });

      // 逐行浮现动画
      var els = rows.querySelectorAll('.row');
      els.forEach(function (el, i) {
        setTimeout(function () { el.classList.add('shown'); }, 60 * i);
      });
      bindCursorHover();

      var dot = document.getElementById('sumDot');
      var txt = document.getElementById('sumText');
      if (d.allOk) {
        dot.className = 'dot ok';
        txt.textContent = '所有系统运行正常 · 共 ' + d.results.length + ' 项检测';
      } else {
        var bad = d.results.filter(function (r) { return !r.ok; }).length;
        dot.className = 'dot fail';
        txt.textContent = '发现 ' + bad + ' 项故障，我们正在关注';
      }
    }

    function load() {
      fetch(API, { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(render)
        .catch(function () {
          document.getElementById('sumDot').className = 'dot fail';
          document.getElementById('sumText').textContent = '状态服务暂时无法访问';
        });
    }

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>

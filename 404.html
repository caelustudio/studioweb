  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0b0b0b;
      --text-primary: #f0f0f0;
      --text-secondary: #d0d0d0;
      --text-muted: #888;
      --border-color: rgba(255,255,255,0.08);
      --btn-bg: rgba(255,255,255,0.06);
      --btn-hover: rgba(255,255,255,0.12);
      --num-color: rgba(255,255,255,0.08);
    }

    [data-theme="light"] {
      --bg-primary: #f5f5f5;
      --text-primary: #1a1a1a;
      --text-secondary: #2a2a2a;
      --text-muted: #555;
      --border-color: rgba(0,0,0,0.1);
      --btn-bg: rgba(0,0,0,0.04);
      --btn-hover: rgba(0,0,0,0.08);
      --num-color: rgba(0,0,0,0.05);
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
      transition: background 0.3s ease, color 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    /* ===== 巨大 404 水印数字 ===== */
    .bg-num {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(14rem, 45vw, 34rem);
      font-weight: 200;
      letter-spacing: -0.04em;
      color: var(--num-color);
      user-select: none;
      pointer-events: none;
      line-height: 1;
      animation: bgFloat 8s ease-in-out infinite;
      transition: color 0.3s ease;
    }

    @keyframes bgFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-14px) scale(1.02); }
    }

    /* ===== 主题切换按钮 ===== */
    .theme-toggle {
      position: fixed;
      top: 1.2rem;
      right: 1.2rem;
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--text-primary);
      user-select: none;
      z-index: 10;
    }

    .theme-toggle:hover {
      transform: scale(1.08);
      background: var(--btn-hover);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .theme-toggle:hover svg {
      transform: rotate(30deg);
    }

    /* ===== 内容 ===== */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .code-tag {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 2rem;
      padding: 0.35rem 1.1rem;
      margin-bottom: 1.6rem;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 500;
      letter-spacing: 0.01em;
      margin-bottom: 1rem;
      transition: color 0.3s ease;
    }

    .description {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 300;
      color: var(--text-secondary);
      line-height: 1.7;
      max-width: 460px;
      transition: color 0.3s ease;
    }

    .path-code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.85em;
      padding: 0.1rem 0.45rem;
      border-radius: 0.4rem;
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      word-break: break-all;
    }

    /* ===== 倒计时 ===== */
    .countdown {
      margin-top: 1.1rem;
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      transition: color 0.3s ease;
    }

    .countdown button {
      background: none;
      border: none;
      padding: 0;
      margin-left: 0.4rem;
      font: inherit;
      color: var(--text-secondary);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .countdown button:hover {
      color: var(--text-primary);
    }

    /* ===== 按钮组 ===== */
    .actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 2.4rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .action-link {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.65rem 1.8rem;
      border-radius: 2.5rem;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      background: var(--text-primary);
      color: var(--bg-primary);
      border: 1px solid transparent;
    }

    .action-link:hover {
      transform: translateY(-2px);
      opacity: 0.85;
    }

    .action-link.ghost {
      background: var(--btn-bg);
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    .action-link.ghost:hover {
      background: var(--btn-hover);
    }

    .action-link svg {
      width: 1rem;
      height: 1rem;
      fill: currentColor;
    }

    /* ===== 底部 ===== */
    .footer-note {
      position: fixed;
      bottom: 1.4rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      user-select: none;
      z-index: 1;
      transition: color 0.3s ease;
    }

    /* ===== 加载条动画（呼应主站 loader）===== */
    .loader-bar {
      width: 120px;
      height: 2px;
      border-radius: 2px;
      background: var(--border-color);
      overflow: hidden;
      position: relative;
      margin-top: 2.2rem;
    }

    .loader-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background: var(--text-muted);
      border-radius: 2px;
      animation: slide 1.2s ease-in-out infinite;
    }

    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <script>
    // ===== 主题切换（与主站共用 localStorage 记忆）=====
    (function theme() {
      const toggleBtn = document.getElementById('themeToggle');
      const icon = document.getElementById('themeIcon');
      const html = document.documentElement;

      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
      let currentTheme = localStorage.getItem('theme') || (prefersDark.matches ? 'dark' : 'light');

      function setTheme(theme) {
        currentTheme = theme;
        html.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        updateIcon(theme);
      }

      function updateIcon(theme) {
        if (theme === 'dark') {
          icon.innerHTML = `<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>`;
        } else {
          icon.innerHTML = `<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/><path d="M12 4a8 8 0 0 0-4 15 8 8 0 0 0 4-15z" opacity="0.6"/>`;
        }
      }

      toggleBtn.addEventListener('click', () => {
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
      });

      prefersDark.addEventListener('change', (e) => {
        if (!localStorage.getItem('theme')) {
          setTheme(e.matches ? 'dark' : 'light');
        }
      });

      setTheme(currentTheme);
    })();

    // ===== 显示用户实际访问的错误路径 =====
    (function badPath() {
      var el = document.getElementById('badPath');
      var path = decodeURIComponent(window.location.pathname) || '/';
      el.textContent = path.length > 60 ? path.slice(0, 60) + '…' : path;
    })();

    // ===== 倒计时自动返回主页 =====
    (function countdown() {
      var remain = 10;
      var text = document.getElementById('countdownText');
      var timer = setInterval(function () {
        remain--;
        if (remain <= 0) {
          clearInterval(timer);
          window.location.replace('/');
          return;
        }
        text.textContent = remain + ' 秒后自动返回主页';
      }, 1000);

      document.getElementById('cancelCountdown').addEventListener('click', function () {
        clearInterval(timer);
        document.getElementById('countdown').style.display = 'none';
        document.querySelector('.loader-bar').style.display = 'none';
      });
    })();
  </script>
